appId: com.claudecodeui.app
productName: Claude Code UI
directories:
  output: release
files:
  - electron/dist/**/*
  - client/dist/**/*
  - server/dist/**/*
  - server/package.json
  - package.json
asar: false
npmRebuild: false
nodeGypRebuild: false
extraMetadata:
  main: electron/dist/main.js
extraResources:
  - from: node_modules/.pnpm
    to: app/node_modules/.pnpm
    filter:
      - '**/*'
  - from: node_modules/.bin
    to: app/node_modules/.bin
    filter:
      - '**/*'
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Development
