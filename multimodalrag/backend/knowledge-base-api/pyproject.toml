[tool.poetry]
name = "roys-legion-knowledge-base-api"
version = "0.1.0"
description = "Legacy optional FastAPI service for storing, retrieving, and managing knowledge-base data with SQL and Milvus."
authors = ["William's AI Studio contributors"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "0.95.2"
uvicorn = {version = "0.22.0", extras = ["standard"]}
sqlalchemy = "1.4.54"
pydantic = "1.10.24"
pymilvus = "2.5.6"
python-dotenv = "1.1.1"
alembic = "1.13.3"
passlib = {version = "1.7.4", extras = ["bcrypt"]}
requests = "2.32.5"
python-multipart = "0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-asyncio = "1.3.0"
httpx = "0.24.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
